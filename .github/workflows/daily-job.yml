name: Daily maintenance

# Reminders, auto-confirmation of fixes, priority refresh and upload cleanup.
# Calling the endpoint also wakes the Render service if it is asleep, hence the retries.
on:
  schedule:
    - cron: "30 0 * * *"  # 06:00 IST
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily job
        env:
          APP_URL: ${{ secrets.APP_URL }}
          JOB_TOKEN: ${{ secrets.JOB_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-delay 30 --retry-all-errors --max-time 120 \
            -X POST "$APP_URL/api/internal/jobs/daily" \
            -H "X-Job-Token: $JOB_TOKEN"
