name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: citypulse
          POSTGRES_PASSWORD: citypulse
          POSTGRES_DB: citypulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U citypulse" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check backend tests
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://citypulse:citypulse@localhost:5432/citypulse
        run: pytest -q -x
      - name: Migrations apply cleanly to PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://citypulse:citypulse@localhost:5432/citypulse
        run: |
          python -c "import sqlalchemy as sa; e=sa.create_engine('postgresql+psycopg://citypulse:citypulse@localhost:5432/citypulse'); c=e.connect(); c.execute(sa.text('DROP SCHEMA public CASCADE; CREATE SCHEMA public')); c.commit()"
          alembic upgrade head
          alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - working-directory: app
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npx playwright test
        env:
          E2E_PYTHON: python
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: docker build -t citypulse:ci .
      - name: Image starts and passes its health check
        run: |
          docker run -d --name cp -p 8000:8000 \
            -e APP_ENV=test -e DATABASE_URL=sqlite:////tmp/ci.db -e SECRET_KEY=ci-secret-key-0123456789abcdef0123 \
            -e GEOCODER=off -e APP_URL=http://localhost:8000 citypulse:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && exit 0; sleep 2; done
          docker logs cp; exit 1
